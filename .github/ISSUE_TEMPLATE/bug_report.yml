name: 缺陷报告
description: 面板不显示、数字不对、按钮没用——都可以从这里开始
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        在提交之前，请先确认两件事：

        1. **host 半边改了要重启 DSH 才生效**（client 半边硬刷新即可）；
        2. 面板弹层底部会显示「刷新于 HH:MM:SS」——如果这个时间不动，是轮询断了，不是解析问题。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自检
      options:
        - label: 我已经重启过 DSH（或确认这次改动只涉及客户端）
          required: true
        - label: 我已经在浏览器里硬刷新过（Ctrl+Shift+R）
          required: true
        - label: 我搜过已有 issue，没有重复
          required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 跑 `dsh --version` 的输出
      placeholder: 0.2.0-rc.2
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 家庭版 26300 / macOS 15 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 仓库的 release 标签或 commit
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 你看到的现象，以及你期望的现象
    validations:
      required: true

  - type: textarea
    id: route
    attributes:
      label: 状态路由的响应
      description: |
        这一条**最关键**——它会带上 `raw` 字段，也就是解析器的输入原文。
        很多「数字不对」的根因一眼就能在 `raw` 里看出来。
      render: json
      placeholder: |
        curl.exe -s "http://127.0.0.1:19387/task-progress"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 在后台跑 `curl -# -o demo.zip <url>`
        2. 点开面板
        3. 看到 ……（期望 ……）
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: 控制台报错（可选）
      description: 开发者工具 Console 里的未捕获异常
      render: text
    validations:
      required: false
